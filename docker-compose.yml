services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: user
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    volumes:
       - postgres_data:/var/lib/postgresql

# Qdrant dashboard URL: http://localhost:6333/dashboard
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_STATIC_CONTENT=true

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - valkey
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/db
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
      - REDIS_PORT=6379
      - GRPC_PORT=50051

  valkey:
     image: valkey/valkey:latest
     ports:
       - "6379:6379"
     volumes:
       - valkey_data:/data

  texts_ai:
     build: ./texts_ai
     command: python texts_ai.py
     ports:
       - "50051:50051"
     depends_on:
       - valkey
       - qdrant
     environment:
       - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
       - REDIS_PORT=6379
       - QDRANT_PORT=6333
       - GRPC_PORT=50051

# http://localhost:8080/?pgsql=postgres&username=user&db=db&password=password
  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
      - ADMINER_DEFAULT_DB=db
      - ADMINER_DEFAULT_USER=user
      - ADMINER_DEFAULT_PASSWORD=password

volumes:
  postgres_data:
  qdrant_data:
  valkey_data: